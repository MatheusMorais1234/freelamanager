<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="FreelaManager: clientes, contratos e recebimentos num lugar só. Gratuito, de código aberto e com demonstração para testar sem cadastro."
    />
    <title>FreelaManager — gestão de clientes e contratos para freelancers</title>
    <meta property="og:title" content="FreelaManager" />
    <meta property="og:description" content="Clientes, contratos e recebimentos num lugar só. Teste a demonstração sem cadastro." />
    <meta property="og:image" content="https://app.matheusmorais.com/icon-512.png" />
    <meta name="theme-color" content="#131116" />

    <!-- Aplica o tema salvo ANTES do React desenhar. Sem este
         trecho, a tela pisca no tema errado por um instante
         (o famoso "flash of wrong theme"). -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem("freelamanager:theme");
          var claro =
            salvo === "light" ||
            (!salvo && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (!claro) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = claro ? "light" : "dark";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
