# Sobe um Postgres limpo, aplica as migrations, roda os testes e compila o front.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest

    # os testes de integracao precisam de um Postgres de verdade
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freelamanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/freelamanager_test?schema=public
      JWT_SECRET: segredo-apenas-para-a-ci
      JWT_EXPIRES_IN: 7d

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # o client gerado fica fora do git
      - name: Gerar o cliente do Prisma
        run: npx prisma generate

      - name: Aplicar as migrações
        run: npx prisma migrate deploy

      - name: Rodar os testes
        run: npm test

  frontend:
    name: Frontend (testes e build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Compilar para produção
        run: npm run build
